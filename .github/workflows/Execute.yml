name: Hourly Weather Update

on:
  schedule:
    # 日本時間の 07:00, 13:00, 19:00 に実行
    # UTCでは 22:00, 04:00, 10:00 になります
    - cron: '0 4,10,22 * * *'
  workflow_dispatch:

jobs:
  update-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 実行結果をリポジトリに書き込む権限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python script
        run: python download.py  # 画像にあるファイル名に合わせました

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add files/*.pdf files/*.png
          git commit -m "Update weather maps $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
